    <text x="95" y="728">• 18 tablas: institución, periodos, grados, secciones, estudiantes,</text>
    <text x="95" y="751">  docentes, matrículas, áreas, asignaciones, actividades,</text>
    <text x="95" y="774">  resultados, historial, asistencia, usuarios, roles</text>
    <text x="95" y="800">• student_identity: datos personales separados (seudonimización)</text>
    <text x="95" y="826">• blockchain_evidence: HMAC, evidenceId, TX_ID, bloque, estado</text>
    <text x="95" y="852">• traceability_event: REGISTRO · VERIFICACION · RECTIFICACION</text>
    <text x="95" y="878">• vistas seudonimizadas · respaldo/recuperación con mysqldump</text>
    <text x="95" y="904">• volumen persistente mysql_data · puerto 3306</text>
  </g>

  <rect x="930" y="660" width="630" height="280" rx="14" fill="#e8f0fa" stroke="#1f6fb2" stroke-width="2.5"/>
  <text x="1245" y="694" text-anchor="middle" font-size="20" font-weight="700" fill="#174f80">ON-CHAIN · Hyperledger Fabric 2.5 (Docker)</text>
  <g font-size="14.5" fill="#1b2a3a">
    <text x="955" y="728">• OrdererOrg: orderer Raft · NuevoHorizonteOrg y AcademicValidatorOrg:</text>
    <text x="955" y="751">  un peer y una CA por organización</text>
    <text x="955" y="777">• Canal academicchannel · endorsement MAJORITY (2 de 2)</text>
    <text x="955" y="803">• Chaincode academic-traceability (TypeScript, CCaaS)</text>
    <text x="955" y="826">  createAcademicEvidence · readAcademicEvidence</text>
    <text x="955" y="849">  academicEvidenceExists · getAcademicEvidenceHistory</text>
    <text x="955" y="875">• Ledger: AcademicEvidence inmutable por versión</text>
    <text x="955" y="901">• volúmenes persistentes por nodo</text>
  </g>

  <line x1="275" y1="595" x2="275" y2="657" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#a)"/>

  <line x1="910" y1="800" x2="928" y2="800" stroke="#1b3a5c" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="70" y="965" width="1490" height="72" rx="12" fill="#fff6e5" stroke="#d89b2b" stroke-width="1.5"/>
  <text x="800" y="995" text-anchor="middle" font-size="15.5" font-weight="700" fill="#8a5a00">Frontera de privacidad: hacia Fabric solo viajan REG-xxxxxx, evidenceId, tipo de evento, versión, HMAC, actor seudónimo (ADM/DOC-PSE-xxx) y rol.</text>
  <text x="800" y="1021" text-anchor="middle" font-size="14.5" fill="#5b3d00">Nombres, documentos, notas y el propio seudónimo del estudiante permanecen en MySQL (verificado: 0 coincidencias en los 20 bloques del canal).</text>
