site_name: Taller de HTML desde cero
site_description: Vinculación con el Medio - Ingeniería de Sistemas
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle: {icon: material/weather-night, name: Modo oscuro}
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle: {icon: material/weather-sunny, name: Modo claro}
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.top
    - search.highlight
  icon:
    logo: material/language-html5
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist: {custom_checkbox: true}
nav:
  - Inicio: index.md
  - 1. Estructura básica: estructura.md
  - 2. Títulos y texto: texto.md
  - 3. Listas: listas.md
  - 4. Enlaces e imágenes: enlaces-imagenes.md
  - 5. Estilo con CSS: css.md
  - 6. Partes de una página: partes.md
  - 7. Trucos que impresionan: trucos.md
  - "8. Flexbox": flex.md
  - "Proyecto: Mi tarjeta": proyecto.md
  - Retos: retos.md
  - Si algo sale mal: ayuda.md
