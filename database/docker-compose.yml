# Almacenamiento Off-chain: MySQL 8 (8.4 LTS).
# Uso:  docker compose --env-file .env up -d      (desde database/)
# Los datos persisten en el volumen mysql_data.

name: trazabilidad-offchain

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-trazabilidad
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en database/.env}
      MYSQL_DATABASE: nuevo_horizonte_trazabilidad
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
